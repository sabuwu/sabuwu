name: sabuwu

x-app: &app
  image: sabuwu-wordpress:7.1.3
  build:
    context: .
    dockerfile: docker/wordpress/Dockerfile
    args:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
  environment: &app-env
    DB_NAME: ${DB_NAME:-wordpress}
    DB_USER: ${DB_USER:-wordpress}
    DB_HOST: ${DB_HOST:-database:3306}
    DB_PASSWORD_FILE: /run/portfolio-secrets/DB_PASSWORD
    DB_TABLE_PREFIX: ${DB_TABLE_PREFIX:-wp_}
    WORDPRESS_URL: ${WORDPRESS_URL:-http://localhost:8088}
    WORDPRESS_TITLE: ${WORDPRESS_TITLE:-Sabuwu | WordPress Portfolio}
    WORDPRESS_ADMIN_USER: ${WORDPRESS_ADMIN_USER:-portfolio_owner}
    WORDPRESS_ADMIN_EMAIL: ${WORDPRESS_ADMIN_EMAIL:-portfolio@example.test}
    WORDPRESS_ADMIN_PASSWORD_FILE: /run/portfolio-secrets/WORDPRESS_ADMIN_PASSWORD
    WP_ENVIRONMENT_TYPE: ${WP_ENVIRONMENT_TYPE:-development}
    WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-true}
    TRUST_REVERSE_PROXY: ${TRUST_REVERSE_PROXY:-false}
    WORDPRESS_FORCE_SSL_ADMIN: ${WORDPRESS_FORCE_SSL_ADMIN:-false}
    AKISMET_API_KEY: ${AKISMET_API_KEY:-}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_SECURE: ${SMTP_SECURE:-tls}
    SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-portfolio@example.test}
    SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Sabuwu}
    TZ: ${TZ:-America/Fortaleza}
  volumes:
    - ./app/wordpress:/var/www/html:z
    - app_secrets:/run/portfolio-secrets:ro
  networks:
    - frontend
    - backend
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: &logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  bootstrap:
    <<: *app
    user: "0:0"
    entrypoint: ["php", "/opt/portfolio/docker/wordpress/bootstrap-secrets.php"]
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-}
      AUTH_KEY: ${AUTH_KEY:-}
      SECURE_AUTH_KEY: ${SECURE_AUTH_KEY:-}
      LOGGED_IN_KEY: ${LOGGED_IN_KEY:-}
      NONCE_KEY: ${NONCE_KEY:-}
      AUTH_SALT: ${AUTH_SALT:-}
      SECURE_AUTH_SALT: ${SECURE_AUTH_SALT:-}
      LOGGED_IN_SALT: ${LOGGED_IN_SALT:-}
      NONCE_SALT: ${NONCE_SALT:-}
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
    volumes:
      - ./.env:/bootstrap/.env:z
      - app_secrets:/run/portfolio-secrets
      - db_secrets:/run/database-secrets
    networks:
      - backend
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    restart: "no"

  database:
    image: mariadb:11.4@sha256:70cc072b29b4a89ae07abb2d4da2c64678a7f2dfe092751bb51c87d67dc1338b
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD_FILE: /run/portfolio-secrets/DB_PASSWORD
      MARIADB_ROOT_PASSWORD_FILE: /run/database-secrets/DB_ROOT_PASSWORD
      MARIADB_ROOT_HOST: localhost
      TZ: ${TZ:-America/Fortaleza}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - database_data:/var/lib/mysql
      - app_secrets:/run/portfolio-secrets:ro
      - db_secrets:/run/database-secrets:ro
    networks:
      - backend
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          test -s /run/portfolio-secrets/DB_PASSWORD &&
          MYSQL_PWD=$$(cat /run/portfolio-secrets/DB_PASSWORD)
          mariadb --protocol=tcp --host=127.0.0.1 --user="$$MARIADB_USER"
          --database="$$MARIADB_DATABASE" --batch --skip-column-names
          --execute='SELECT 1' >/dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 300s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    logging: *logging

  wordpress:
    <<: *app
    ports:
      - "${WORDPRESS_BIND:-127.0.0.1}:${WORDPRESS_PORT:-8088}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/opt/portfolio/docker/wordpress/healthcheck.sh"]
      interval: 30s
      timeout: 20s
      retries: 5
      start_period: 1800s
    restart: unless-stopped

  cron:
    <<: *app
    entrypoint: ["/opt/portfolio/docker/cron/run.sh"]
    environment:
      <<: *app-env
      CRON_INTERVAL: ${CRON_INTERVAL:-60}
    depends_on:
      wordpress:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "/opt/portfolio/docker/cron/healthcheck.php"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  wp-cli:
    <<: *app
    profiles: [tools]
    entrypoint: ["wp", "--path=/var/www/html"]
    depends_on:
      wordpress:
        condition: service_healthy
    restart: "no"

networks:
  frontend:
  backend:
    internal: true

volumes:
  database_data:
  app_secrets:
  db_secrets:

