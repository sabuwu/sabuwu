ServerName localhost
ServerTokens Prod
ServerSignature Off
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
</Directory>
<Directory /var/www/html/wp-content/uploads>
    AllowOverride None
    <FilesMatch "(?i)\.(php[0-9]*|phtml|phar|cgi|sh)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
<FilesMatch "^(wp-config(?:-.*)?\.php|\.env.*|\.git.*|.*\.sql)$">
    Require all denied
</FilesMatch>
<Files xmlrpc.php>
    Require all denied
</Files>

